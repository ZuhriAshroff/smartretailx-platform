global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "user_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["user_service:8001"]
        labels:
          service: user-management-service

  - job_name: "product_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["product_service:8002"]
        labels:
          service: product-catalogue-service

  - job_name: "order_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["order_service:8003"]
        labels:
          service: order-processing-service

  - job_name: "inventory_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["inventory_service:8004"]
        labels:
          service: inventory-management-service

  - job_name: "notification_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["notification_service:8005"]
        labels:
          service: notification-service

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
