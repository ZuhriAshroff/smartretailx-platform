worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;

    upstream user_service_upstream {
        server user_service:8001;
    }

    upstream product_service_upstream {
        server product_service:8002;
    }

    upstream order_service_upstream {
        server order_service:8003;
    }

    upstream inventory_service_upstream {
        server inventory_service:8004;
    }

    upstream notification_service_upstream {
        server notification_service:8005;
    }

    server {
        listen 80;

        # -----------------------------------------------------------------
        # SmartRetailX API Gateway
        # Routes /v1/* requests to the owning microservice based on path
        # prefix. Each service is also independently reachable on its own
        # published host port (8001-8005) for direct Swagger UI access.
        # -----------------------------------------------------------------

        location /v1/auth {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            proxy_pass http://user_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /v1/users {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            proxy_pass http://user_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /v1/products {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            proxy_pass http://product_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /v1/orders {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            proxy_pass http://order_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /v1/inventory {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            proxy_pass http://inventory_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /v1/notifications {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            proxy_pass http://notification_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # Each service's Swagger UI HTML always references its OpenAPI spec
        # at the absolute path "/openapi.json", regardless of the prefix used
        # to reach it - FastAPI has no idea it's sitting behind a prefixed
        # reverse proxy. sub_filter rewrites that reference in the returned
        # HTML to a per-service path, and a matching location below proxies
        # that path back to the correct upstream's real /openapi.json.

        location /docs/user {
            rewrite ^/docs/user(.*)$ /docs$1 break;
            proxy_pass http://user_service_upstream;
            proxy_set_header Host $host;
            sub_filter '/openapi.json' '/docs/user/openapi.json';
            sub_filter_once on;
        }

        location = /docs/user/openapi.json {
            rewrite ^ /openapi.json break;
            proxy_pass http://user_service_upstream;
            proxy_set_header Host $host;
        }

        location /docs/product {
            rewrite ^/docs/product(.*)$ /docs$1 break;
            proxy_pass http://product_service_upstream;
            proxy_set_header Host $host;
            sub_filter '/openapi.json' '/docs/product/openapi.json';
            sub_filter_once on;
        }

        location = /docs/product/openapi.json {
            rewrite ^ /openapi.json break;
            proxy_pass http://product_service_upstream;
            proxy_set_header Host $host;
        }

        location /docs/order {
            rewrite ^/docs/order(.*)$ /docs$1 break;
            proxy_pass http://order_service_upstream;
            proxy_set_header Host $host;
            sub_filter '/openapi.json' '/docs/order/openapi.json';
            sub_filter_once on;
        }

        location = /docs/order/openapi.json {
            rewrite ^ /openapi.json break;
            proxy_pass http://order_service_upstream;
            proxy_set_header Host $host;
        }

        location /docs/inventory {
            rewrite ^/docs/inventory(.*)$ /docs$1 break;
            proxy_pass http://inventory_service_upstream;
            proxy_set_header Host $host;
            sub_filter '/openapi.json' '/docs/inventory/openapi.json';
            sub_filter_once on;
        }

        location = /docs/inventory/openapi.json {
            rewrite ^ /openapi.json break;
            proxy_pass http://inventory_service_upstream;
            proxy_set_header Host $host;
        }

        location /docs/notification {
            rewrite ^/docs/notification(.*)$ /docs$1 break;
            proxy_pass http://notification_service_upstream;
            proxy_set_header Host $host;
            sub_filter '/openapi.json' '/docs/notification/openapi.json';
            sub_filter_once on;
        }

        location = /docs/notification/openapi.json {
            rewrite ^ /openapi.json break;
            proxy_pass http://notification_service_upstream;
            proxy_set_header Host $host;
        }

        location = / {
            default_type application/json;
            return 200 '{"service":"SmartRetailX API Gateway","docs":["/docs/user","/docs/product","/docs/order","/docs/inventory","/docs/notification"]}';
        }
    }
}
