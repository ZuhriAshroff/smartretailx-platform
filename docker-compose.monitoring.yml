# Separate compose file for the monitoring stack, as requested.
# Run the main stack first (docker-compose up --build), then bring this up
# joining the same external network:
#   docker-compose -f docker-compose.monitoring.yml up --build

networks:
  smartretailx_net:
    external: true
    name: smartretailx_net

volumes:
  prometheus_data:
  grafana_data:

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: smartretailx_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    networks: [smartretailx_net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: smartretailx_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [smartretailx_net]
    restart: unless-stopped
